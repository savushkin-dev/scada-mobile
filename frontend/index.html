<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Мониторинг: «Савушкин продукт» (Брест)</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192x192.png" />
    <!--
      Шрифты — только локальные (public/assets/fonts), без внешних CDN:
      приложение работает в изолированной сети предприятия без доступа в интернет.
      Preload основного (кириллического) начертания, чтобы текст интерфейса
      сразу отрисовался шрифтом Inter.
    -->
    <link
      rel="preload"
      href="/assets/fonts/inter-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Стили splash-экрана встроены инлайн, чтобы загрузочный экран отрисовывался
      немедленно — до прихода основного CSS/JS-бандла по медленной сети.
      Правило проекта: ни один байт стилей/шрифтов не запрашивается с внешних
      серверов, поэтому этот экран — единственное, что видит пользователь
      на медленном Wi-Fi вместо пустой страницы.
    -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f8f9fa;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        z-index: 9999;
      }
      .boot-splash__logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      .boot-splash__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e8eaed;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      .boot-splash__status {
        margin: 0;
        padding: 0 24px;
        max-width: 320px;
        text-align: center;
        font-size: 14px;
        line-height: 1.4;
        color: #74777f;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Splash-экран первичной загрузки: живёт внутри #root и автоматически
        удаляется React при первом рендере приложения (createRoot очищает
        контейнер). Никаких внешних ресурсов не требует.
      -->
      <div class="boot-splash" role="status" aria-live="polite">
        <img
          class="boot-splash__logo"
          src="/assets/icons/icon-192x192.png"
          alt=""
          aria-hidden="true"
        />
        <div class="boot-splash__spinner" aria-hidden="true"></div>
        <p class="boot-splash__status" id="boot-splash-status">Загрузка приложения…</p>
      </div>
    </div>
    <script>
      /*
        Этапные подсказки на splash-экране: если сеть медленная, пользователь
        видит живой статус вместо «зависшей» страницы. Таймеры безопасны после
        монтирования React: элемент уже удалён из DOM, проверка isConnected.
      */
      (function () {
        var stages = [
          [4000, 'Загружаем основные ресурсы…'],
          [10000, 'Соединение медленное, продолжаем загрузку…'],
          [25000, 'Загрузка занимает необычно долго — проверьте подключение к сети предприятия.'],
        ];
        stages.forEach(function (stage) {
          setTimeout(function () {
            var status = document.getElementById('boot-splash-status');
            if (status && status.isConnected) {
              status.textContent = stage[1];
            }
          }, stage[0]);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
