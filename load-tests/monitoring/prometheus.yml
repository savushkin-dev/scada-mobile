# Prometheus конфиг для стенда нагрузочного тестирования (НТ-3, #65).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: scada-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          # backend стенда на хосте (make load-back-run); порт — env LOAD_BACKEND_PORT
          # (задаётся в docker-compose.yml; синтаксис :- не поддерживается Prometheus)
          - host.docker.internal:${LOAD_BACKEND_PORT}
        labels:
          app: scada-mobile-backend
          env: loadtest
