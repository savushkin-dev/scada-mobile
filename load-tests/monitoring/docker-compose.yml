name: scada-loadtest-monitoring

# Мониторинг стенда нагрузочного тестирования (эпик #51, НТ-3 #65).
# Backend стенда работает на хосте (make load-back-run, порт 8081),
# поэтому Prometheus скрейпит host.docker.internal.

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: scada-loadtest-prometheus
    # Prometheus НЕ разворачивает env-переменные в конфиге — подставляем
    # порт backend'а через sed перед стартом (placeholder @LOAD_BACKEND_PORT@,
    # значение из $LOAD_BACKEND_PORT, по умолчанию 8081).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s/@LOAD_BACKEND_PORT@/$${LOAD_BACKEND_PORT}/"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.resolved.yml &&
        exec /bin/prometheus
        --config.file=/tmp/prometheus.resolved.yml
        --storage.tsdb.retention.time=2d
        --web.enable-remote-write-receiver
    ports:
      - "${LOAD_MON_PROM_PORT:-9090}:9090"
    environment:
      # Prometheus подставляет в prometheus.yml (там $LOAD_BACKEND_PORT)
      LOAD_BACKEND_PORT: ${LOAD_BACKEND_PORT:-8081}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Для Linux-сервера (в Docker Desktop на Windows/Mac работает из коробки)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: scada-loadtest-grafana
    ports:
      - "${LOAD_MON_GRAF_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
